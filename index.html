g><span>URL encode / decode</span><b>Open Tool →</b></button><button class="card" data-tool="Base64 Encoder/Decoder"><strong>Base64 Encoder/Decoder</strong><span>Base64 encode / decode</span><b>Open Tool →</b></button><button class="card" data-tool="Regex Tester"><strong>Regex Tester</strong><span>Regex matches</span><b>Open Tool →</b></button><button class="card" data-tool="HTML Editor"><strong>HTML Editor</strong><span>Live HTML preview</span><b>Open Tool →</b></button><button class="card" data-tool="Code Playground"><strong>Code Playground</strong><span>HTML preview</span><b>Open Tool →</b></button><button class="card" data-tool="Color Picker"><strong>Color Picker</strong><span>Color चुनें</span><b>Open Tool →</b></button><button class="card" data-tool="CSS Gradient Generator"><strong>CSS Gradient Generator</strong><span>Gradient CSS</span><b>Open Tool →</b></button><button class="card" data-tool="CSS Shadow Generator"><strong>CSS Shadow Generator</strong><span>Shadow CSS</span><b>Open Tool →</b></button><button class="card" data-tool="Image to PDF"><strong>Image to PDF</strong><span>Image को print/save PDF</span><b>Open Tool →</b></button><button class="card" data-tool="PDF Maker"><strong>PDF Maker</strong><span>Text को print/save PDF</span><b>Open Tool →</b></button><button class="card" data-tool="Resume Maker"><strong>Resume Maker</strong><span>Simple resume document</span><b>Open Tool →</b></button><button class="card" data-tool="Invoice Maker"><strong>Invoice Maker</strong><span>Simple invoice document</span><b>Open Tool →</b></button><button class="card" data-tool="Certificate Maker"><strong>Certificate Maker</strong><span>Simple certificate document</span><b>Open Tool →</b></button><button class="card" data-tool="To-Do List"><strong>To-Do List</strong><span>Tasks browser में save</span><b>Open Tool →</b></button><button class="card" data-tool="Notes"><strong>Notes</strong><span>Notes browser में save</span><b>Open Tool →</b></button><button class="card" data-tool="Shopping List"><strong>Shopping List</strong><span>Shopping list save</span><b>Open Tool →</b></button><button class="card" data-tool="Random Picker"><strong>Random Picker</strong><span>Random item</span><b>Open Tool →</b></button><button class="card" data-tool="Timer"><strong>Timer</strong><span>Countdown timer</span><b>Open Tool →</b></button><button class="card" data-tool="Stopwatch"><strong>Stopwatch</strong><span>Stopwatch</span><b>Open Tool →</b></button><button class="card" data-tool="Password Generator"><strong>Password Generator</strong><span>Random password</span><b>Open Tool →</b></button><button class="card" data-tool="Business Name Generator"><strong>Business Name Generator</strong><span>Business name ideas</span><b>Open Tool →</b></button><button class="card" data-tool="Slogan Generator"><strong>Slogan Generator</strong><span>Slogan ideas</span><b>Open Tool →</b></button><button class="card" data-tool="Caption Generator"><strong>Caption Generator</strong><span>Caption ideas</span><b>Open Tool →</b></button><button class="card" data-tool="Hashtag Generator"><strong>Hashtag Generator</strong><span>Hashtag ideas</span><b>Open Tool →</b></button><button class="card" data-tool="SEO Title Generator"><strong>SEO Title Generator</strong><span>SEO title ideas</span><b>Open Tool →</b></button><button class="card" data-tool="UTM Builder"><strong>UTM Builder</strong><span>Marketing URL</span><b>Open Tool →</b></button><button class="card" data-tool="Web Search"><strong>Web Search</strong><span>Google search</span><b>Open Tool →</b></button><button class="card" data-tool="Image Search"><strong>Image Search</strong><span>Google Images</span><b>Open Tool →</b></button><button class="card" data-tool="News Search"><strong>News Search</strong><span>Google News</span><b>Open Tool →</b></button><button class="card" data-tool="Maps"><strong>Maps</strong><span>Google Maps</span><b>Open Tool →</b></button><button class="card" data-tool="Wikipedia Search"><strong>Wikipedia Search</strong><span>Wikipedia</span><b>Open Tool →</b></button><button class="card" data-tool="Property Search"><strong>Property Search</strong><span>Property search</span><b>Open Tool →</b></button><button class="card" data-tool="Voice Recorder"><strong>Voice Recorder</strong><span>Audio record</span><b>Open Tool →</b></button><button class="card" data-tool="Screen Recorder"><strong>Screen Recorder</strong><span>Screen record</span><b>Open Tool →</b></button><button class="card" data-tool="Text to Speech"><strong>Text to Speech</strong><span>Text सुनें</span><b>Open Tool →</b></button><button class="card" data-tool="Speech to Text"><strong>Speech to Text</strong><span>Microphone text</span><b>Open Tool →</b></button></div></section><section id="app" class="hide"></section></main>
<script>

const $ = (s) => document.querySelector(s);
const app = $("#app"), home = $("#home"), search = $("#search"), grid = $("#grid");
let timer = null, stopwatch = null, seconds = 0, mediaRecorder = null, chunks = [];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function show(title, body){
  home.classList.add("hide");
  app.classList.remove("hide");
  app.innerHTML = `<div class="panel"><button class="back" id="back">← Back</button><h2>${esc(title)}</h2>${body}</div>`;
  $("#back").onclick=()=>{app.classList.add("hide");home.classList.remove("hide");};
}
function output(x){const o=$("#out"); if(o)o.innerHTML=x;}

const toolMap={};
document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click",()=>openTool(card.dataset.tool));
  toolMap[card.dataset.tool]=card;
});
search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("hide",q && !c.innerText.toLowerCase().includes(q)));
});

function openTool(t){
  const file=`<input id="file" type="file" accept="image/*">`;
  if(t==="Image Compressor") return show(t,`${file}<input id="target" type="number" value="500" min="1" placeholder="Target KB"><button id="run">Compress</button><div id="out"></div>`);
  if(t==="Image Resizer") return show(t,`${file}<input id="w" type="number" placeholder="Width"><input id="h" type="number" placeholder="Height"><button id="run">Resize</button><div id="out"></div>`);
  if(t==="Image Cropper") return show(t,`${file}<button id="run">Center Crop 1:1</button><div id="out"></div>`);
  if(t==="Image Converter") return show(t,`${file}<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select><button id="run">Convert</button><div id="out"></div>`);
  if(t==="QR Code Maker") return show(t,`<input id="text" placeholder="URL या text"><button id="run">Generate QR</button><div id="out"></div>`);
  if(["Calculator","Percentage Calculator","Discount Calculator","Age Calculator","Unit Converter"].includes(t)) return show(t,calcUI(t));
  if(["Word Counter","Case Converter","JSON Formatter","URL Encoder/Decoder","Base64 Encoder/Decoder","Regex Tester"].includes(t)) return show(t,textUI(t));
  if(["HTML Editor","Code Playground"].includes(t)) return show(t,`<textarea id="code" rows="12"><h1>Hello FreeToolsHub</h1><p>Edit this HTML.</p></textarea><button id="run">Preview</button><div id="out"></div>`);
  if(t==="Color Picker") return show(t,`<input id="color" type="color" value="#155eef"><div id="out">#155eef</div>`);
  if(t==="CSS Gradient Generator") return show(t,`<input id="c1" type="color" value="#155eef"><input id="c2" type="color" value="#7f56d9"><button id="run">Generate</button><div id="out"></div>`);
  if(t==="CSS Shadow Generator") return show(t,`<input id="x" type="number" value="0"><input id="y" type="number" value="4"><input id="blur" type="number" value="12"><button id="run">Generate</button><div id="out"></div>`);
  if(["To-Do List","Notes","Shopping List"].includes(t)) return show(t,`<input id="item" placeholder="Type here"><button id="run">Save</button><div id="out"></div>`);
  if(t==="Random Picker") return show(t,`<textarea id="items" rows="8" placeholder="One item per line"></textarea><button id="run">Pick</button><div id="out"></div>`);
  if(t==="Timer") return show(t,`<input id="sec" type="number" value="60"><button id="run">Start</button><button id="stop">Stop</button><div id="out">Ready</div>`);
  if(t==="Stopwatch") return show(t,`<button id="run">Start</button><button id="stop">Stop</button><button id="reset">Reset</button><div id="out">0 s</div>`);
  if(t==="Password Generator") return show(t,`<input id="len" type="number" value="16"><button id="run">Generate</button><div id="out"></div>`);
  if(["Business Name Generator","Slogan Generator","Caption Generator","Hashtag Generator","SEO Title Generator"].includes(t)) return show(t,`<input id="keyword" placeholder="Keyword"><button id="run">Generate</button><div id="out"></div>`);
  if(t==="UTM Builder") return show(t,`<input id="url" placeholder="https://example.com"><input id="source" placeholder="source"><input id="medium" placeholder="medium"><input id="campaign" placeholder="campaign"><button id="run">Build URL</button><div id="out"></div>`);
  if(["Web Search","Image Search","News Search","Maps","Wikipedia Search","Property Search"].includes(t)) return show(t,`<input id="q" placeholder="Search"><button id="run">Open Search</button><div id="out"></div>`);
  if(t==="Text to Speech") return show(t,`<textarea id="text" rows="8"></textarea><button id="run">Speak</button><div id="out"></div>`);
  if(t==="Speech to Text") return show(t,`<button id="run">Start Microphone</button><div id="out"></div>`);
  if(t==="Voice Recorder") return show(t,`<button id="run">Start Recording</button><button id="stop">Stop</button><div id="out"></div>`);
  if(t==="Screen Recorder") return show(t,`<button id="run">Start Screen Recording</button><div id="out"></div>`);
  if(["Image to PDF","PDF Maker","Resume Maker","Invoice Maker","Certificate Maker"].includes(t)) return show(t,`<textarea id="doc" rows="12" placeholder="अपना content लिखें"></textarea><button id="run">Print / Save as PDF</button><div id="out"></div>`);
  show(t,`<p>यह tool अभी basic version में है।</p><p>हम fake result नहीं दिखाते।</p>`);
  bindRun(t);
}
function calcUI(t){
 if(t==="Calculator") return `<input id="a" placeholder="2*(10+5)/3"><button id="run">Calculate</button><div id="out"></div>`;
 if(t==="Percentage Calculator") return `<input id="a" type="number" placeholder="Number"><input id="b" type="number" placeholder="Percent"><button id="run">Calculate</button><div id="out"></div>`;
 if(t==="Discount Calculator") return `<input id="a" type="number" placeholder="Price"><input id="b" type="number" placeholder="Discount %"><button id="run">Calculate</button><div id="out"></div>`;
 if(t==="Age Calculator") return `<input id="date" type="date"><button id="run">Calculate</button><div id="out"></div>`;
 return `<input id="a" type="number" placeholder="Value"><select id="unit"><option>km-mi</option><option>mi-km</option><option>kg-lb</option><option>lb-kg</option><option>m-ft</option><option>ft-m</option><option>C-F</option><option>F-C</option></select><button id="run">Convert</button><div id="out"></div>`;
}
function textUI(t){
 if(t==="Word Counter"||t==="Case Converter") return `<textarea id="text" rows="10"></textarea><button id="run">Run</button><div id="out"></div>`;
 if(t==="JSON Formatter") return `<textarea id="text" rows="10" placeholder='{"hello":"world"}'></textarea><button id="run">Format</button><div id="out"></div>`;
 if(t==="URL Encoder/Decoder") return `<textarea id="text" rows="6"></textarea><button id="enc">Encode</button><button id="dec">Decode</button><div id="out"></div>`;
 if(t==="Base64 Encoder/Decoder") return `<textarea id="text" rows="6"></textarea><button id="enc">Encode</button><button id="dec">Decode</button><div id="out"></div>`;
 return `<textarea id="text" rows="6"></textarea><input id="regex" placeholder="Regex"><button id="run">Test</button><div id="out"></div>`;
}
function bindRun(t){
 const run=$("#run"); if(run)run.onclick=()=>{
  try{
   if(t==="Image Compressor") imageProcess("compress");
   else if(t==="Image Resizer") imageProcess("resize");
   else if(t==="Image Cropper") imageProcess("crop");
   else if(t==="Image Converter") imageProcess("convert");
   else if(t==="QR Code Maker") {const q=encodeURIComponent($("#text").value);output(`<img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${q}"><br><a target="_blank" href="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${q}">Open QR image</a>`);}
   else if(t==="Calculator") output(esc(String(Function('"use strict";return ('+$("#a").value+')')())));
   else if(t==="Percentage Calculator") output(String(+$("#a").value*+$("#b").value/100));
   else if(t==="Discount Calculator"){let p=+$("#a").value,d=+$("#b").value;output(`Final: ${p-p*d/100}`);}
   else if(t==="Age Calculator"){let d=new Date($("#date").value),n=new Date(),a=n.getFullYear()-d.getFullYear();if(new Date(n.getFullYear(),d.getMonth(),d.getDate())>n)a--;output(`${a} years`);}
   else if(t==="Unit Converter") unitConvert();
   else if(t==="Word Counter"){let x=$("#text").value;output(`Words: ${x.trim()?x.trim().split(/\s+/).length:0}<br>Characters: ${x.length}<br>Lines: ${x?x.split(/\n/).length:0}`);}
   else if(t==="Case Converter"){let x=$("#text").value;output(`<pre>${esc(x.toUpperCase())}\n\n${esc(x.toLowerCase())}\n\n${esc(x.replace(/\b\w/g,m=>m.toUpperCase()))}</pre>`);}
   else if(t==="JSON Formatter"){try{output(`<pre>${esc(JSON.stringify(JSON.parse($("#text").value),null,2))}</pre>`)}catch(e){output("Invalid JSON");}}
   else if(t==="HTML Editor"||t==="Code Playground") output(`<iframe id="preview"></iframe>`),$("#preview").srcdoc=$("#code").value;
   else if(t==="Color Picker") output(esc($("#color").value));
   else if(t==="CSS Gradient Generator") output(`<pre>background: linear-gradient(90deg, ${$("#c1").value}, ${$("#c2").value});</pre>`);
   else if(t==="CSS Shadow Generator") output(`<pre>box-shadow: ${$("#x").value}px ${$("#y").value}px ${$("#blur").value}px #0003;</pre>`);
   else if(["To-Do List","Notes","Shopping List"].includes(t)) saveLocal(t);
   else if(t==="Random Picker"){let a=$("#items").value.split(/\n/).map(x=>x.trim()).filter(Boolean);output(a.length?esc(a[Math.floor(Math.random()*a.length)]):"List खाली है");}
   else if(t==="Timer") startTimer();
   else if(t==="Stopwatch") startStopwatch();
   else if(t==="Password Generator") generatePassword();
   else if(["Business Name Generator","Slogan Generator","Caption Generator","Hashtag Generator","SEO Title Generator"].includes(t)) generateIdeas(t);
   else if(t==="UTM Builder"){let u=$("#url").value;let p=new URL(u);p.searchParams.set("utm_source",$("#source").value);p.searchParams.set("utm_medium",$("#medium").value);p.searchParams.set("utm_campaign",$("#campaign").value);output(`<a target="_blank" href="${esc(p.href)}">${esc(p.href)}</a>`);}
   else if(["Web Search","Image Search","News Search","Maps","Wikipedia Search","Property Search"].includes(t)) externalSearch(t);
   else if(t==="Text to Speech") speechSynthesis.speak(new SpeechSynthesisUtterance($("#text").value));
   else if(t==="Speech to Text") speechToText();
   else if(t==="Voice Recorder") recordAudio();
   else if(t==="Screen Recorder") recordScreen();
   else if(["Image to PDF","PDF Maker","Resume Maker","Invoice Maker","Certificate Maker"].includes(t)) printDocumen
