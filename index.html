<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeToolsHub – Free Online Tools</title>
<meta name="description" content="Free online tools for images, PDF, text, calculators, coding, business and daily work.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f6f8fb;
  color:#172033;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}
header{
  position:sticky;
  top:0;
  z-index:5;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:14px
}
.head{
  max-width:1200px;
  margin:auto;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between
}
.logo{
  font-size:22px;
  font-weight:800;
  color:#2563eb
}
.search{
  width:min(480px,55vw);
  padding:11px 14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none
}
main{
  max-width:1200px;
  margin:auto;
  padding:18px
}
.hero{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  border-radius:20px;
  padding:28px 20px;
  margin-bottom:20px
}
.hero h1{
  margin:0 0 8px;
  font-size:clamp(28px,6vw,46px)
}
.hero p{
  margin:0;
  opacity:.92
}
.layout{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:18px
}
nav{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:10px;
  height:max-content;
  position:sticky;
  top:85px
}
.navbtn{
  width:100%;
  border:0;
  background:transparent;
  padding:11px;
  text-align:left;
  border-radius:10px;
  cursor:pointer;
  font-size:14px
}
.navbtn:hover,
.navbtn.active{
  background:#eff6ff;
  color:#2563eb
}
.section{
  margin-bottom:28px
}
.section h2{
  margin:0 0 12px;
  font-size:21px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px
}
.card{
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:16px;
  padding:16px;
  text-align:left;
  cursor:pointer;
  min-height:130px;
  transition:.15s
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px #00000012
}
.card b{
  display:block;
  font-size:16px;
  margin-bottom:7px
}
.card small{
  color:#667085;
  line-height:1.4
}
.open{
  margin-top:12px;
  display:inline-block;
  background:#2563eb;
  color:#fff;
  border-radius:9px;
  padding:7px 10px;
  font-size:12px
}
#toolPage{
  display:none
}
.toolbox{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:18px;
  max-width:850px;
  margin:auto
}
.toolbox h2{
  margin-top:0
}
.back{
  border:0;
  background:#eef2ff;
  color:#3730a3;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:16px
}
input,textarea,select{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font:inherit;
  margin:6px 0 10px;
  background:#fff
}
textarea{
  min-height:150px;
  resize:vertical
}
button.action{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  margin:4px 4px 4px 0
}
button.secondary{
  border:1px solid #d1d5db;
  background:#fff;
  color:#172033;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer
}
.result{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
  white-space:pre-wrap;
  overflow:auto
}
.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}
.file{
  padding:14px;
  border:2px dashed #cbd5e1;
  border-radius:12px;
  background:#f8fafc
}
.preview{
  max-width:100%;
  max-height:320px;
  display:block;
  margin:12px auto;
  border-radius:10px
}
.muted{
  color:#667085;
  font-size:13px
}
footer{
  text-align:center;
  color:#667085;
  padding:30px 15px
}
@media(max-width:760px){
  .head{
    flex-direction:column;
    align-items:stretch
  }
  .search{
    width:100%
  }
  .layout{
    grid-template-columns:1fr
  }
  nav{
    position:static;
    display:flex;
    overflow:auto;
    gap:5px
  }
  .navbtn{
    min-width:max-content
  }
  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}
@media(max-width:430px){
  .grid{
    grid-template-columns:1fr
  }
  main{
    padding:12px
  }
  .row{
    grid-template-columns:1fr
  }
}
</style>
</head>

<script>
"use strict";

const $ = id => document.getElementById(id);

const homePage = $("homePage");
const toolPage = $("toolPage");
const toolBox = $("toolBox");
const search = $("search");

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showTool(title,html){
  homePage.style.display="none";
  toolPage.style.display="block";

  toolBox.innerHTML =
    '<button class="back" id="backBtn">← वापस All Tools</button>'+
    '<h2>'+escapeHtml(title)+'</h2>'+
    html;

  $("backBtn").onclick=()=>{
    toolPage.style.display="none";
    homePage.style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  };

  window.scrollTo({top:0,behavior:"smooth"});
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function downloadText(text,name,type="text/plain"){
  downloadBlob(new Blob([text],{type}),name);
}

function formatBytes(n){
  if(n<1024) return n+" B";
  if(n<1024*1024) return (n/1024).toFixed(1)+" KB";
  return (n/1024/1024).toFixed(2)+" MB";
}

function imageFromFile(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error("Image load failed"));
    img.src=URL.createObjectURL(file);
  });
}

function canvasBlob(canvas,type,quality){
  return new Promise(resolve=>canvas.toBlob(resolve,type,quality));
}
</script><script>
/* =========================
   TOOL OPEN SYSTEM
========================= */

document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click",()=>{
    openTool(card.dataset.tool);
  });
});

document.querySelectorAll(".navbtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");

    const cat=btn.dataset.cat;

    document.querySelectorAll(".section").forEach(section=>{
      section.style.display =
        cat==="all" || section.dataset.section===cat
        ? ""
        : "none";
    });
  });
});

search.addEventListener("input",()=>{
  const q=search.value.toLowerCase().trim();

  document.querySelectorAll(".card").forEach(card=>{
    const text=card.innerText.toLowerCase();
    card.style.display=!q || text.includes(q) ? "" : "none";
  });
});


/* =========================
   TOOL ROUTER
========================= */

function openTool(tool){

/* IMAGE COMPRESSOR */

if(tool==="Image Compressor"){
showTool("Image Compressor",`
<div class="file">
<input type="file" id="imgFile" accept="image/*">
<label>Target size (KB)</label>
<input id="targetKB" type="number" value="500" min="10">
<button class="action" id="compressBtn">Compress Image</button>
</div>
<div id="imgInfo" class="result">Image select करें।</div>
<img id="imgPreview" class="preview" style="display:none">
`);

$("compressBtn").onclick=async()=>{
 const file=$("imgFile").files[0];
 const target=Number($("targetKB").value);

 if(!file){
   $("imgInfo").textContent="पहले image select करें।";
   return;
 }

 if(!target || target<1){
   $("imgInfo").textContent="Valid target KB डालें।";
   return;
 }

 try{
   const img=await imageFromFile(file);

   let scale=1;
   let canvas=document.createElement("canvas");
   let blob=null;

   for(let attempt=0;attempt<12;attempt++){

     canvas.width=Math.max(1,Math.round(img.width*scale));
     canvas.height=Math.max(1,Math.round(img.height*scale));

     const ctx=canvas.getContext("2d");
     ctx.drawImage(img,0,0,canvas.width,canvas.height);

     let quality=0.9;

     for(let q=0;q<9;q++){
       blob=await canvasBlob(canvas,"image/jpeg",quality);

       if(blob.size/1024<=target) break;

       quality-=0.1;
     }

     if(blob && blob.size/1024<=target) break;

     scale*=0.8;
   }

   if(!blob){
     throw new Error("Compression failed");
   }

   $("imgInfo").innerHTML=
     "Original: <b>"+formatBytes(file.size)+
     "</b><br>Compressed: <b>"+formatBytes(blob.size)+
     "</b><br>Dimensions: "+canvas.width+" × "+canvas.height;

   $("imgPreview").src=URL.createObjectURL(blob);
   $("imgPreview").style.display="block";

   const download=document.createElement("button");
   download.className="action";
   download.textContent="Download Compressed Image";

   download.onclick=()=>{
     downloadBlob(blob,"compressed-image.jpg");
   };

   $("imgInfo").appendChild(document.createElement("br"));
   $("imgInfo").appendChild(download);

 }catch(e){
   $("imgInfo").textContent="Image compress नहीं हो सकी: "+e.message;
 }
};
return;
}


/* IMAGE RESIZER */

if(tool==="Image Resizer"){
showTool("Image Resizer",`
<input type="file" id="resizeFile" accept="image/*">

<div class="row">
<div>
<label>Width</label>
<input id="resizeW" type="number">
</div>
<div>
<label>Height</label>
<input id="resizeH" type="number">
</div>
</div>

<button class="action" id="resizeBtn">Resize Image</button>
<div id="resizeResult" class="result"></div>
`);

$("resizeBtn").onclick=async()=>{
 const file=$("resizeFile").files[0];

 if(!file){
   $("resizeResult").textContent="Image select करें।";
   return;
 }

 try{
   const img=await imageFromFile(file);

   let w=Number($("resizeW").value);
   let h=Number($("resizeH").value);

   if(!w) w=img.width;
   if(!h) h=img.height;

   const canvas=document.createElement("canvas");
   canvas.width=w;
   canvas.height=h;

   canvas.getContext("2d").drawImage(img,0,0,w,h);

   canvas.toBlob(blob=>{
     $("resizeResult").innerHTML=
       "New size: "+w+" × "+h+"<br>";

     const btn=document.createElement("button");
     btn.className="action";
     btn.textContent="Download Image";
     btn.onclick=()=>downloadBlob(blob,"resized-image.png");

     $("resizeResult").appendChild(btn);
   },"image/png");

 }catch(e){
   $("resizeResult").textContent="Resize failed.";
 }
};
return;
}


/* IMAGE CROPPER */

if(tool==="Image Cropper"){
showTool("Image Cropper",`
<input type="file" id="cropFile" accept="image/*">

<div class="row">
<div>
<label>X</label>
<input id="cropX" type="number" value="0">
</div>
<div>
<label>Y</label>
<input id="cropY" type="number" value="0">
</div>
<div>
<label>Width</label>
<input id="cropW" type="number" value="300">
</div>
<div>
<label>Height</label>
<input id="cropH" type="number" value="300">
</div>
</div>

<button class="action" id="cropBtn">Crop Image</button>
<div id="cropResult" class="result"></div>
`);

$("cropBtn").onclick=async()=>{
 const file=$("cropFile").files[0];

 if(!file){
   $("cropResult").textContent="Image select करें।";
   return;
 }

 const img=await imageFromFile(file);

 let x=Math.max(0,Number($("cropX").value));
 let y=Math.max(0,Number($("cropY").value));
 let w=Math.max(1,Number($("cropW").value));
 let h=Math.max(1,Number($("cropH").value));

 if(x>=img.width || y>=img.height){
   $("cropResult").textContent="X/Y image के अंदर रखें।";
   return;
 }

 w=Math.min(w,img.width-x);
 h=Math.min(h,img.height-y);

 const canvas=document.createElement("canvas");
 canvas.width=w;
 canvas.height=h;

 canvas.getContext("2d").drawImage(
   img,x,y,w,h,0,0,w,h
 );

 canvas.toBlob(blob=>{
   $("cropResult").textContent="Crop तैयार है।";

   const btn=document.createElement("button");
   btn.className="action";
   btn.textContent="Download Crop";
   btn.onclick=()=>downloadBlob(blob,"cropped-image.png");

   $("cropResult").appendChild(document.createElement("br"));
   $("cropResult").appendChild(btn);
 },"image/png");
};
return;
}


/* IMAGE CONVERTER */

if(tool==="Image Converter"){
showTool("Image Converter",`
<input type="file" id="convertFile" accept="image/*">

<label>Format</label>
<select id="convertType">
<option value="image/png">PNG</option>
<option value="image/jpeg">JPG</option>
<option value="image/webp">WebP</option>
</select>

<button class="action" id="convertBtn">Convert</button>
<div id="convertResult" class="result"></div>
`);

$("convertBtn").onclick=async()=>{
 const file=$("convertFile").files[0];

 if(!file){
   $("convertResult").textContent="Image select करें।";
   return;
 }

 const img=await imageFromFile(file);

 const canvas=document.createElement("canvas");
 canvas.width=img.width;
 canvas.height=img.height;

 canvas.getContext("2d").drawImage(img,0,0);

 const type=$("convertType").value;

 canvas.toBlob(blob=>{
   const ext=
     type==="image/png"?"png":
     type==="image/webp"?"webp":"jpg";

   $("convertResult").textContent="Conversion complete.";

   const btn=document.createElement("button");
   btn.className="action";
   btn.textContent="Download "+ext.toUpperCase();

   btn.onclick=()=>downloadBlob(blob,"converted-image."+ext);

   $("convertResult").appendChild(document.createElement("br"));
   $("convertResult").appendChild(btn);
 },type,0.92);
};
return;
}


/* QR CODE */

if(tool==="QR Code Maker"){
showTool("QR Code Maker",`
<label>Text या URL</label>
<input id="qrText" placeholder="https://example.com">

<button class="action" id="qrBtn">Generate QR</button>

<div id="qrResult" class="result"></div>
`);

$("qrBtn").onclick=()=>{

     now.getMonth(),
     0

 }

 if(months<0){
   years--;
   months+=12;
 }

 $("ageResult").textContent=
 `Age: ${years} years, ${months} months, ${days} days`;
};
return;
}

 String(s).padStart(2,"0");

 updateTimer();
}

     clearInterval(timer);
     timer=null;
     alert("Timer finished!");
   }
 },1000);
};

 clearInterval(timer);
 timer=null;
};

};

}

00:00.00

<button class="secondary" id="stopReset">Reset</button>
`);

let running=false;
let startTime=0;
let elapsed=0;
let animation=null;

function drawStopwatch(){
 const total=running
   ? elapsed+(performance.now()-startTime)
   : elapsed;

 const sec=Math.floor(total/1000);
 const min=Math.floor(sec/60);
 const seconds=sec%60;
 const ms=Math.floor((total%1000)/10);

 $("stopDisplay").textContent=
   String(min).padStart(2,"0")+":"+
   String(seconds).padStart(2,"0")+"."+
   String(ms).padStart(2,"0");

 if(running){
   animation=requestAnimationFrame(drawStopwatch);
 }
}

$("stopStart").onclick=()=>{
 if(running)return;

 startTime=performance.now();
 running=true;
 drawStopwatch();
};

$("stopPause").onclick=()=>{
 if(!running)return;

 elapsed+=performance.now()-startTime;
 running=false;

 cancelAnimationFrame(animation);
 drawStopwatch();
};

$("stopReset").onclick=()=>{
 running=false;
 elapsed=0;

 cancelAnimationFrame(animation);
 drawStopwatch();
};

drawStopwatch();
return;
}

   const medium=$("utmMedium").value.trim();
   const campaign=$("utmCampaign").value.trim();

   if(source)u.searchParams.set("utm_source",source);
   if(medium)u.searchParams.set("utm_medium",medium);
   if(campaign)u.searchParams.set("utm_campaign",campaign);

   $("utmResult").textContent=u.toString();

   const copy=document.createElement("button");
   copy.className="action";
   copy.textContent="Copy URL";

   copy.onclick=async()=>{
     await navigator.clipboard.writeText(u.toString());
     copy.textContent="Copied!";
   };

   $("utmResult").appendChild(document.createElement("br"));
   $("utmResult").appendChild(copy);

 }catch{
   $("utmResult").textContent="Valid URL डालें।";
 }
};

return;
}


/* FALLBACK */

oldOpenTool(tool);

};

}


/* =========================
   EXTRA SEARCH
========================= */

function externalSearch(type){

let query=prompt("क्या search करना है?");

if(!query)return;

const urls={
 web:"https://www.google.com/search?q=",
 image:"https://www.google.com/search?tbm=isch&q=",
 news:"https://news.google.com/search?q=",
 maps:"https://www.google.com/maps/search/",
 wikipedia:"https://en.wikipedia.org/wiki/Special:Search?search="
};

if(urls[type]){
 window.open(
   urls[type]+encodeURIComponent(query),
   "_blank"
 );
}

}


/* =========================
   SERVICE WORKER OPTIONAL
========================= */

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{
 navigator.serviceWorker.register(
   URL.createObjectURL(
     new Blob([`
       self.addEventListener("install",e=>self.skipWaiting());
       self.addEventListener("activate",e=>self.clients.claim());
     `],{type:"text/javascript"})
   )
 ).catch(()=>{});
});

}
